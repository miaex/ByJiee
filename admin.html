<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>By Jiee — Panneau d'admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800;900&family=Space+Mono:wght@400;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.1/cropper.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.1/cropper.min.js"></script>
<style>
  :root {
    --paper: #FBF6EC; --paper-alt: #FFFFFF; --ink: #171310; --ink-soft: #5C554C;
    --magenta: #E63B8F; --blue: #3457E8; --yellow: #F5B400; --green: #12A672;
    --coral: #FF5A3C; --purple: #7B3FE4;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--paper); color: var(--ink); font-family: 'Inter', sans-serif; display: flex; min-height: 100vh; }

  #authGate {
    position: fixed; inset: 0; z-index: 500; background: var(--ink); color: var(--paper);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 2rem;
  }
  #authGate .logo { font-family: 'Big Shoulders Display', sans-serif; font-weight: 900; font-size: 1.6rem; margin-bottom: 0.3rem; }
  #authGate .logo span { color: var(--magenta); }
  #authGate .sub { font-family: 'Space Mono', monospace; font-size: 0.7rem; color: #8A8377; letter-spacing: 0.1em; margin-bottom: 2rem; }
  #authGate form { display: flex; flex-direction: column; gap: 0.9rem; width: 100%; max-width: 280px; }
  #authGate input { background: #1F3348; border: 2px solid #3A4E63; border-radius: 8px; padding: 0.75rem 0.9rem; color: var(--paper); font-family: 'Inter', sans-serif; font-size: 0.95rem; text-align: center; }
  #authGate input:focus { outline: none; border-color: var(--magenta); }
  #authGate .btn-login { background: var(--magenta); color: white; border: none; border-radius: 999px; padding: 0.9rem 1.8rem; font-family: 'Space Mono', monospace; font-weight: 700; font-size: 0.85rem; cursor: pointer; }
  #authGate .error-msg { font-family: 'Space Mono', monospace; font-size: 0.72rem; color: var(--coral); display: none; margin-top: -0.3rem; }
  #authGate .error-msg.show { display: block; }
  #appContent { display: none; width: 100%; }
  #appContent.unlocked { display: flex; }

  aside { width: 250px; flex-shrink: 0; background: var(--ink); color: var(--paper); display: flex; flex-direction: column; padding: 1.6rem 1.1rem; }
  .logo { font-family: 'Big Shoulders Display', sans-serif; font-weight: 900; font-size: 1.3rem; margin-bottom: 0.2rem; display: flex; align-items: center; gap: 0.5rem; }
  .logo img { width: 22px; height: 22px; object-fit: contain; }
  .logo span { color: var(--magenta); }
  .sub-logo { font-family: 'Space Mono', monospace; font-size: 0.65rem; color: #8A8377; letter-spacing: 0.08em; margin-bottom: 2rem; }
  nav.side-nav { display: flex; flex-direction: column; gap: 0.2rem; flex: 1; overflow-y: auto; }
  .nav-group-label { font-family: 'Space Mono', monospace; font-size: 0.62rem; letter-spacing: 0.1em; text-transform: uppercase; color: #8A8377; margin: 1rem 0.6rem 0.4rem; }
  .nav-item { display: flex; align-items: center; gap: 0.6rem; padding: 0.55rem 0.7rem; border-radius: 8px; color: #D8D2C6; font-size: 0.85rem; font-weight: 500; cursor: pointer; border: none; background: none; text-align: left; width: 100%; font-family: 'Inter', sans-serif; }
  .nav-item .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--c, var(--magenta)); flex-shrink: 0; }
  .nav-item:hover { background: rgba(255,255,255,0.06); color: var(--paper); }
  .nav-item.active { background: var(--paper); color: var(--ink); font-weight: 700; }
  .nav-item.active .dot { background: var(--c, var(--magenta)); }
  .nav-item .badge-count { margin-left: auto; font-family: 'Space Mono', monospace; font-size: 0.68rem; opacity: 0.6; }
  .nav-item .badge-unread { margin-left: auto; background: var(--coral); color: white; border-radius: 999px; font-family: 'Space Mono', monospace; font-size: 0.65rem; font-weight: 700; padding: 0.05rem 0.4rem; }
  .side-footer { font-family: 'Space Mono', monospace; font-size: 0.68rem; color: #8A8377; padding-top: 1rem; border-top: 1px solid rgba(255,255,255,0.1); }
  .side-footer a { color: #8A8377; text-decoration: underline; }

  main { flex: 1; padding: 2.2rem 2.6rem; max-width: 1040px; }
  .top-row { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 2rem; flex-wrap: wrap; gap: 1rem; }
  .eyebrow { font-family: 'Space Mono', monospace; font-size: 0.7rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--c, var(--magenta)); font-weight: 700; margin-bottom: 0.4rem; }
  h1 { font-family: 'Big Shoulders Display', sans-serif; font-weight: 800; font-size: 2.1rem; }
  .btn-add { background: var(--ink); color: var(--paper); border: none; border-radius: 999px; padding: 0.75rem 1.3rem; font-family: 'Space Mono', monospace; font-weight: 700; font-size: 0.8rem; cursor: pointer; display: inline-flex; align-items: center; gap: 0.5rem; box-shadow: 4px 4px 0 var(--c, var(--magenta)); transition: transform 0.15s; }
  .btn-add:hover { transform: translate(-2px, -2px); }

  .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 1rem; margin-bottom: 2rem; }
  .stat-card { background: var(--paper-alt); border: 2px solid var(--ink); border-radius: 14px; padding: 1.2rem 1.3rem; box-shadow: 4px 4px 0 var(--c, var(--magenta)); }
  .stat-card .num { font-family: 'Big Shoulders Display', sans-serif; font-weight: 800; font-size: 2.2rem; }
  .stat-card .label { font-family: 'Space Mono', monospace; font-size: 0.7rem; color: var(--ink-soft); text-transform: uppercase; letter-spacing: 0.06em; }

  .content-list { display: flex; flex-direction: column; gap: 0.8rem; }
  .item-card { background: var(--paper-alt); border: 2px solid var(--ink); border-radius: 14px; padding: 1.1rem 1.3rem; display: flex; align-items: center; gap: 1rem; justify-content: space-between; }
  .item-thumb { width: 46px; height: 46px; border-radius: 10px; background: var(--c, var(--magenta)); flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-family: 'Big Shoulders Display', sans-serif; font-weight: 800; color: white; font-size: 1.1rem; overflow: hidden; position: relative; border: 2px solid var(--ink); }
  .item-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .item-thumb .img-count { position: absolute; bottom: 0; right: 0; background: var(--ink); color: white; font-family: 'Space Mono', monospace; font-size: 0.55rem; font-weight: 700; padding: 0.05rem 0.28rem; border-top-left-radius: 6px; }
  .item-info { flex: 1; min-width: 0; }
  .item-info .title { font-weight: 700; font-size: 0.98rem; margin-bottom: 0.15rem; }
  .item-info .desc { font-size: 0.85rem; color: var(--ink-soft); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item-info .meta { font-family: 'Space Mono', monospace; font-size: 0.7rem; color: var(--c, var(--magenta)); margin-top: 0.3rem; }
  .item-info .btn-tag { display: inline-block; font-family: 'Space Mono', monospace; font-size: 0.65rem; background: var(--ink); color: white; padding: 0.1rem 0.5rem; border-radius: 999px; margin-top: 0.3rem; margin-right: 0.3rem; }
  .item-actions { display: flex; gap: 0.5rem; flex-shrink: 0; }
  .icon-btn { width: 34px; height: 34px; border-radius: 8px; border: 2px solid var(--ink); background: var(--paper-alt); cursor: pointer; font-size: 0.9rem; display: flex; align-items: center; justify-content: center; }
  .icon-btn:hover { background: var(--ink); color: var(--paper); }
  .icon-btn.danger:hover { background: var(--coral); border-color: var(--coral); color: white; }

  .empty-state { text-align: center; padding: 3rem 1.5rem; border: 2px dashed var(--ink-soft); border-radius: 14px; color: var(--ink-soft); }
  .empty-state p { font-family: 'Space Mono', monospace; font-size: 0.85rem; margin-top: 0.5rem; }
  .loading-state { text-align: center; padding: 3rem 1.5rem; color: var(--ink-soft); font-family: 'Space Mono', monospace; font-size: 0.85rem; }

  .modal-overlay { position: fixed; inset: 0; background: rgba(23,19,16,0.55); display: none; align-items: center; justify-content: center; z-index: 200; padding: 1.5rem; overflow-y: auto; }
  .modal-overlay.show { display: flex; }
  .modal { background: var(--paper-alt); border: 2.5px solid var(--ink); border-radius: 18px; padding: 1.8rem; max-width: 460px; width: 100%; box-shadow: 8px 8px 0 var(--c, var(--magenta)); margin: auto; }
  .modal h2 { font-family: 'Big Shoulders Display', sans-serif; font-weight: 800; font-size: 1.4rem; margin-bottom: 1.2rem; }
  .field { display: flex; flex-direction: column; gap: 0.35rem; margin-bottom: 1rem; }
  label { font-family: 'Space Mono', monospace; font-size: 0.68rem; letter-spacing: 0.06em; text-transform: uppercase; font-weight: 700; color: var(--ink-soft); }
  input, textarea, select { background: var(--paper); border: 2px solid var(--ink); border-radius: 8px; padding: 0.65rem 0.8rem; font-family: 'Inter', sans-serif; font-size: 0.9rem; width: 100%; }
  input:focus, textarea:focus, select:focus { outline: none; border-color: var(--c, var(--magenta)); }
  textarea { resize: vertical; min-height: 70px; }
  .modal-actions { display: flex; gap: 0.7rem; margin-top: 1.4rem; }
  .btn-secondary, .btn-primary { flex: 1; padding: 0.7rem; border-radius: 999px; font-family: 'Space Mono', monospace; font-weight: 700; font-size: 0.8rem; cursor: pointer; border: 2px solid var(--ink); }
  .btn-secondary { background: var(--paper-alt); color: var(--ink); }
  .btn-primary { background: var(--ink); color: var(--paper); }
  .btn-primary:disabled { opacity: 0.5; cursor: wait; }

  .image-drop { border: 2px dashed var(--ink-soft); border-radius: 10px; padding: 1rem; text-align: center; cursor: pointer; font-family: 'Space Mono', monospace; font-size: 0.75rem; color: var(--ink-soft); transition: border-color 0.2s, background 0.2s; display: block; }
  .image-drop:hover { border-color: var(--c, var(--magenta)); background: rgba(230,59,143,0.05); }
  .image-drop input[type="file"] { display: none; }
  .image-preview-strip { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 0.7rem; }
  .image-preview-strip .thumb { position: relative; width: 58px; height: 58px; border-radius: 8px; overflow: hidden; border: 2px solid var(--ink); flex-shrink: 0; }
  .image-preview-strip .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .image-preview-strip .thumb .remove-img { position: absolute; top: 1px; right: 1px; width: 18px; height: 18px; border-radius: 50%; background: var(--ink); color: white; border: none; font-size: 0.65rem; cursor: pointer; line-height: 1; display: flex; align-items: center; justify-content: center; }
  .image-preview-strip .thumb .remove-img:hover { background: var(--coral); }
  .upload-status { font-family: 'Space Mono', monospace; font-size: 0.7rem; color: var(--c, var(--magenta)); margin-top: 0.4rem; }

  .toggle-row { display: flex; align-items: center; gap: 0.7rem; margin-bottom: 1rem; }
  .toggle-switch { position: relative; width: 46px; height: 26px; flex-shrink: 0; }
  .toggle-switch input { opacity: 0; width: 0; height: 0; }
  .toggle-slider { position: absolute; inset: 0; background: #D8D2C6; border-radius: 999px; cursor: pointer; transition: 0.2s; }
  .toggle-slider::before { content: ''; position: absolute; width: 20px; height: 20px; left: 3px; top: 3px; background: white; border-radius: 50%; transition: 0.2s; }
  .toggle-switch input:checked + .toggle-slider { background: var(--green); }
  .toggle-switch input:checked + .toggle-slider::before { transform: translateX(20px); }
  .toggle-row .toggle-label { font-family: 'Space Mono', monospace; font-size: 0.8rem; font-weight: 700; }

  .cropper-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 300; display: none; flex-direction: column; align-items: center; justify-content: center; padding: 1.5rem; }
  .cropper-overlay.show { display: flex; }
  .cropper-box { background: var(--ink); border-radius: 16px; padding: 1.2rem; max-width: 500px; width: 100%; }
  .cropper-image-wrap { max-height: 60vh; overflow: hidden; background: #000; border-radius: 8px; }
  .cropper-image-wrap img { display: block; max-width: 100%; }
  .cropper-hint { font-family: 'Space Mono', monospace; font-size: 0.7rem; color: #8A8377; text-align: center; margin: 0.8rem 0 0.6rem; }
  .cropper-ratios { display: flex; gap: 0.5rem; justify-content: center; flex-wrap: wrap; margin-bottom: 0.9rem; }
  .cropper-ratio-btn {
    background: #1F3348; color: #D8D2C6; border: 2px solid #3A4E63; border-radius: 999px;
    padding: 0.4rem 0.9rem; font-family: 'Space Mono', monospace; font-size: 0.72rem; font-weight: 700;
    cursor: pointer;
  }
  .cropper-ratio-btn.active { background: var(--magenta); border-color: var(--magenta); color: white; }
  .cropper-actions { display: flex; gap: 0.7rem; }

  .message-card { background: var(--paper-alt); border: 2px solid var(--ink); border-radius: 14px; padding: 1.1rem 1.3rem; margin-bottom: 0.8rem; }
  .message-card.unread { border-color: var(--magenta); box-shadow: 4px 4px 0 var(--magenta); }
  .message-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 1rem; }
  .message-top .m-name { font-weight: 700; font-size: 0.95rem; }
  .message-top .m-service { font-family: 'Space Mono', monospace; font-size: 0.68rem; color: var(--magenta); text-transform: uppercase; }
  .message-top .m-date { font-family: 'Space Mono', monospace; font-size: 0.68rem; color: var(--ink-soft); white-space: nowrap; }
  .message-contact { font-family: 'Space Mono', monospace; font-size: 0.78rem; color: var(--ink-soft); margin: 0.4rem 0; }
  .message-body { font-size: 0.9rem; margin: 0.5rem 0; }
  .message-actions { display: flex; gap: 0.5rem; margin-top: 0.6rem; }
  .message-actions button { font-family: 'Space Mono', monospace; font-size: 0.7rem; font-weight: 700; padding: 0.35rem 0.7rem; border-radius: 999px; border: 2px solid var(--ink); background: var(--paper-alt); cursor: pointer; }
  .message-actions button:hover { background: var(--ink); color: white; }

  .featured-form { max-width: 480px; }

  @media (max-width: 760px) {
    body { flex-direction: column; }
    aside { width: 100%; flex-direction: row; align-items: center; flex-wrap: wrap; }
    nav.side-nav { flex-direction: row; flex-wrap: wrap; }
    .side-footer { display: none; }
    main { padding: 1.4rem; }
  }
</style>
</head>
<body>

<div id="authGate">
  <div class="logo">BY <span>JIEE</span></div>
  <div class="sub">PANNEAU D'ADMIN — ACCÈS RESTREINT</div>
  <form id="loginForm">
    <input type="email" id="loginUser" placeholder="Email" autocomplete="off" required>
    <input type="password" id="loginPass" placeholder="Mot de passe" required>
    <p class="error-msg" id="loginError">Identifiant ou mot de passe incorrect.</p>
    <button type="submit" class="btn-login">Se connecter</button>
  </form>
</div>

<main>
  <div class="top-row">
    <div>
      <div class="eyebrow" id="viewEyebrow">Vue d'ensemble</div>
      <h1 id="viewTitle">Tableau de bord</h1>
    </div>
    <button class="btn-add" id="addBtn" style="display:none;">+ Ajouter un élément</button>
  </div>

  <div id="dashboardView"></div>
  <div id="listView" class="content-list" style="display:none;"></div>
  <div id="messagesView" style="display:none;"></div>
</main>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <h2 id="modalTitle">Nouvel élément</h2>
    <form id="itemForm">
      <div class="field"><label for="fTitle">Titre</label><input type="text" id="fTitle" required></div>
      <div class="field"><label for="fDesc" id="fDescLabel">Description courte</label><textarea id="fDesc" required></textarea></div>
      <div class="field"><label for="fMeta">Info complémentaire (délai, garantie, statut...)</label><input type="text" id="fMeta" placeholder="Ex: Livraison sous 24h"></div>

      <div id="priceFieldWrap" style="display:none;">
        <div class="field">
          <label for="fPrice">Prix (en FCFA)</label>
          <input type="number" id="fPrice" placeholder="Ex: 15000" min="0" step="1">
        </div>
      </div>

      <div id="featuredFieldWrap" style="display:none;">
        <div class="field">
          <label for="fFullText">Texte complet (affiché au clic)</label>
          <textarea id="fFullText" placeholder="Le texte détaillé, article ou pub, qui se déplie quand le visiteur clique."></textarea>
        </div>
        <div class="field">
          <label for="fFeaturedLink">Lien (optionnel)</label>
          <input type="text" id="fFeaturedLink" placeholder="Ex: storysongs.html ou https://...">
        </div>
      </div>

      <div id="buttonConfigFields" style="display:none;">
        <div class="field">
          <label for="fButtonType">Rôle du bouton "Acheter"</label>
          <select id="fButtonType">
            <option value="">— Choisir —</option>
            <option value="lien_externe">Lien vers boutique externe</option>
            <option value="paiement">Lien de paiement direct</option>
            <option value="whatsapp">Demande via WhatsApp</option>
            <option value="devis">Demande de devis (formulaire)</option>
            <option value="indisponible">Indisponible / Bientôt</option>
          </select>
        </div>
        <div class="field" id="buttonValueField" style="display:none;">
          <label for="fButtonValue" id="buttonValueLabel">Lien</label>
          <input type="text" id="fButtonValue" placeholder="https://...">
        </div>
      </div>

      <div class="field">
        <label>Images</label>
        <label class="image-drop" id="imageDrop">
          Clique pour choisir une image (recadrage automatique)
          <input type="file" id="fImages" accept="image/*">
        </label>
        <p class="upload-status" id="uploadStatus" style="display:none;"></p>
        <div class="image-preview-strip" id="imagePreviewStrip"></div>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn-secondary" id="cancelBtn">Annuler</button>
        <button type="submit" class="btn-primary" id="saveBtn">Enregistrer</button>
      </div>
    </form>
  </div>
</div>

<div class="cropper-overlay" id="cropperOverlay">
  <div class="cropper-box">
    <div class="cropper-image-wrap"><img id="cropperImage"></div>
    <p class="cropper-hint">Ajuste le cadre — choisis un format ou reste en libre</p>
    <div class="cropper-ratios" id="cropperRatios"></div>
    <div class="cropper-actions">
      <button type="button" class="btn-secondary" id="cropperCancel">Annuler</button>
      <button type="button" class="btn-primary" id="cropperConfirm">Valider le recadrage</button>
    </div>
  </div>
</div>

<script>
  // ============ CONFIG SUPABASE ============
  const SUPABASE_URL = 'https://apknunsvetaeltzopdpp.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_MtxZI1erxvww-BU5IIz8og_CsvW7otl';
  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  const sections = [
    { id: 'dashboard', label: 'Tableau de bord', group: null, color: '--magenta' },
    { id: 'featured', label: 'À la une', group: 'Accueil', color: '--yellow' },
    { id: 'graphisme', label: 'Graphisme', group: 'Pages compétences', color: '--magenta' },
    { id: 'storysongs', label: 'StorySongs', group: 'Pages compétences', color: '--blue' },
    { id: 'amenagement', label: 'Aménagement paysager', group: 'Pages compétences', color: '--green' },
    { id: 'chatbots', label: 'Chatbots', group: 'Pages compétences', color: '--purple' },
    { id: 'restauration', label: 'Restauration photo', group: 'Pages compétences', color: '--coral' },
    { id: 'ecriture', label: 'Écriture', group: 'Pages compétences', color: '--yellow' },
    { id: 'webdesign', label: 'Sites web', group: 'Pages compétences', color: '--blue' },
    { id: 'yirmeya', label: 'YIRMEYA', group: 'Pages compétences', color: '--magenta' },
    { id: 'boutique', label: 'Boutique digitale', group: 'Pages compétences', color: '--green' },
    { id: 'messages', label: 'Messages reçus', group: 'Autres', color: '--coral' },
  ];

  let currentSection = 'dashboard';
  let editingId = null;
  let modalImages = [];
  let itemCounts = {};
  let unreadCount = 0;

  const sideNav = document.getElementById('sideNav');
  const dashboardView = document.getElementById('dashboardView');
  const listView = document.getElementById('listView');
  const messagesView = document.getElementById('messagesView');
  const viewTitle = document.getElementById('viewTitle');
  const viewEyebrow = document.getElementById('viewEyebrow');
  const addBtn = document.getElementById('addBtn');

  function renderNav() {
    let html = '';
    let lastGroup = null;
    sections.forEach(s => {
      if (s.group !== lastGroup) {
        if (s.group) html += `<div class="nav-group-label">${s.group}</div>`;
        lastGroup = s.group;
      }
      let badge = '';
      if (s.id === 'messages' && unreadCount > 0) badge = `<span class="badge-unread">${unreadCount}</span>`;
      else if (itemCounts[s.id] !== undefined && s.id !== 'dashboard' && s.id !== 'messages') badge = `<span class="badge-count">${itemCounts[s.id]}</span>`;
      html += `<button class="nav-item ${currentSection === s.id ? 'active' : ''}" style="--c: var(${s.color})" data-id="${s.id}">
        <span class="dot"></span>${s.label}${badge}
      </button>`;
    });
    sideNav.innerHTML = html;
    sideNav.querySelectorAll('.nav-item').forEach(btn => {
      btn.addEventListener('click', () => { navigateTo(btn.dataset.id); });
    });
  }

  async function navigateTo(sectionId) {
    currentSection = sectionId;
    renderNav();
    const section = sections.find(s => s.id === sectionId);

    dashboardView.style.display = 'none';
    listView.style.display = 'none';
    messagesView.style.display = 'none';
    addBtn.style.display = 'none';

    if (sectionId === 'dashboard') {
      viewEyebrow.textContent = "Vue d'ensemble";
      viewTitle.textContent = 'Tableau de bord';
      dashboardView.style.display = 'block';
      await renderDashboard();
    } else if (sectionId === 'messages') {
      viewEyebrow.textContent = 'Autres';
      viewTitle.textContent = 'Messages reçus';
      messagesView.style.display = 'block';
      await renderMessages();
    } else {
      viewEyebrow.textContent = section.group || 'Section';
      viewTitle.textContent = section.label;
      addBtn.style.display = 'inline-flex';
      addBtn.style.setProperty('--c', `var(${section.color})`);
      listView.style.display = 'flex';
      await renderContentList(sectionId, section.color);
    }
  }

  async function renderDashboard() {
    dashboardView.innerHTML = `<div class="loading-state">Chargement...</div>`;
    const { count: totalItems } = await sb.from('content_items').select('*', { count: 'exact', head: true });
    const { count: totalMessages } = await sb.from('messages').select('*', { count: 'exact', head: true });
    const { count: unread } = await sb.from('messages').select('*', { count: 'exact', head: true }).eq('is_read', false);
    unreadCount = unread || 0;
    renderNav();

    dashboardView.innerHTML = `
      <div class="stats-grid">
        <div class="stat-card" style="--c: var(--magenta)"><div class="num">10</div><div class="label">Pages du site</div></div>
        <div class="stat-card" style="--c: var(--blue)"><div class="num">${totalItems || 0}</div><div class="label">Éléments publiés</div></div>
        <div class="stat-card" style="--c: var(--coral)"><div class="num">${unreadCount}</div><div class="label">Messages non lus</div></div>
        <div class="stat-card" style="--c: var(--green)"><div class="num">${totalMessages || 0}</div><div class="label">Messages au total</div></div>
      </div>
      <p style="font-family:'Space Mono',monospace; font-size:0.78rem; color:var(--ink-soft); line-height:1.7;">
        Sélectionne une page dans le menu à gauche pour ajouter ou modifier son contenu. Chaque changement est sauvegardé immédiatement et visible sur le site public.
      </p>
    `;
  }

  async function renderContentList(pageSlug, colorVar) {
    listView.innerHTML = `<div class="loading-state">Chargement...</div>`;
    const { data: items, error } = await sb.from('content_items').select('*').eq('page_slug', pageSlug).order('created_at', { ascending: true });

    if (error) {
      listView.innerHTML = `<div class="empty-state"><p>Erreur de chargement : ${error.message}</p></div>`;
      return;
    }

    itemCounts[pageSlug] = items.length;
    renderNav();

    if (items.length === 0) {
      listView.innerHTML = `<div class="empty-state">
        <div class="eyebrow" style="color:var(--ink-soft)">Rien ici pour l'instant</div>
        <p>Clique sur "+ Ajouter un élément" pour publier ton premier contenu sur cette page.</p>
      </div>`;
      return;
    }

    listView.innerHTML = items.map(item => `
      <div class="item-card">
        <div class="item-thumb" style="--c: var(${colorVar})">
          ${item.images && item.images.length
            ? `<img src="${item.images[0]}" alt="">${item.images.length > 1 ? `<span class="img-count">+${item.images.length - 1}</span>` : ''}`
            : item.title.charAt(0)}
        </div>
        <div class="item-info">
          <div class="title">${item.title}</div>
          <div class="desc">${item.description || ''}</div>
          ${item.price ? `<div class="meta" style="--c: var(${colorVar})">${Number(item.price).toLocaleString('fr-FR')} FCFA</div>` : ''}
          ${item.meta ? `<div class="meta" style="--c: var(${colorVar})">${item.meta}</div>` : ''}
          ${item.button_type ? `<span class="btn-tag">${buttonTypeLabel(item.button_type)}</span>` : ''}
        </div>
        <div class="item-actions">
          <button class="icon-btn" data-edit="${item.id}" title="Modifier">✎</button>
          <button class="icon-btn danger" data-del="${item.id}" title="Supprimer">✕</button>
        </div>
      </div>
    `).join('');

    listView.querySelectorAll('[data-del]').forEach(btn => {
      btn.addEventListener('click', async () => {
        if (!confirm('Supprimer cet élément ?')) return;
        await sb.from('content_items').delete().eq('id', btn.dataset.del);
        await renderContentList(pageSlug, colorVar);
      });
    });
    listView.querySelectorAll('[data-edit]').forEach(btn => {
      btn.addEventListener('click', () => {
        const item = items.find(i => i.id === btn.dataset.edit);
        openModal(item);
      });
    });
  }

  function buttonTypeLabel(type) {
    const labels = { lien_externe: 'Lien externe', paiement: 'Paiement direct', whatsapp: 'WhatsApp', devis: 'Devis', indisponible: 'Indisponible' };
    return labels[type] || type;
  }

  async function renderMessages() {
    messagesView.innerHTML = `<div class="loading-state">Chargement...</div>`;
    const { data: msgs, error } = await sb.from('messages').select('*').order('created_at', { ascending: false });

    if (error) {
      messagesView.innerHTML = `<div class="empty-state"><p>Erreur de chargement : ${error.message}</p></div>`;
      return;
    }

    unreadCount = (msgs || []).filter(m => !m.is_read).length;
    renderNav();

    if (!msgs || msgs.length === 0) {
      messagesView.innerHTML = `<div class="empty-state"><div class="eyebrow" style="color:var(--ink-soft)">Aucun message</div><p>Les demandes envoyées depuis le formulaire de contact du site apparaîtront ici.</p></div>`;
      return;
    }

    messagesView.innerHTML = msgs.map(m => `
      <div class="message-card ${m.is_read ? '' : 'unread'}" data-id="${m.id}">
        <div class="message-top">
          <div>
            <div class="m-name">${m.name || 'Sans nom'}</div>
            <div class="m-service">${m.service || ''}</div>
          </div>
          <div class="m-date">${new Date(m.created_at).toLocaleDateString('fr-FR', { day: '2-digit', month: 'short', year: 'numeric' })}</div>
        </div>
        <div class="message-contact">${m.contact || ''}</div>
        <div class="message-body">${m.message || ''}</div>
        <div class="message-actions">
          <button data-toggle-read="${m.id}" data-read="${m.is_read}">${m.is_read ? 'Marquer non lu' : 'Marquer lu'}</button>
          <button data-del-msg="${m.id}">Supprimer</button>
        </div>
      </div>
    `).join('');

    messagesView.querySelectorAll('[data-toggle-read]').forEach(btn => {
      btn.addEventListener('click', async () => {
        const id = btn.dataset.toggleRead;
        const isRead = btn.dataset.read === 'true';
        await sb.from('messages').update({ is_read: !isRead }).eq('id', id);
        await renderMessages();
      });
    });
    messagesView.querySelectorAll('[data-del-msg]').forEach(btn => {
      btn.addEventListener('click', async () => {
        if (!confirm('Supprimer ce message ?')) return;
        await sb.from('messages').delete().eq('id', btn.dataset.delMsg);
        await renderMessages();
      });
    });
  }

  const overlay = document.getElementById('modalOverlay');
  const modalTitle = document.getElementById('modalTitle');
  const form = document.getElementById('itemForm');
  const fTitle = document.getElementById('fTitle');
  const fDesc = document.getElementById('fDesc');
  const fMeta = document.getElementById('fMeta');
  const fPrice = document.getElementById('fPrice');
  const priceFieldWrap = document.getElementById('priceFieldWrap');
  const fImages = document.getElementById('fImages');
  const imagePreviewStrip = document.getElementById('imagePreviewStrip');
  const uploadStatus = document.getElementById('uploadStatus');
  const saveBtn = document.getElementById('saveBtn');
  const buttonConfigFields = document.getElementById('buttonConfigFields');
  const fButtonType = document.getElementById('fButtonType');
  const buttonValueField = document.getElementById('buttonValueField');
  const buttonValueLabel = document.getElementById('buttonValueLabel');
  const fButtonValue = document.getElementById('fButtonValue');

  fButtonType.addEventListener('change', () => {
    const type = fButtonType.value;
    if (type === 'lien_externe' || type === 'paiement') {
      buttonValueField.style.display = 'block';
      buttonValueLabel.textContent = type === 'lien_externe' ? 'Lien vers la boutique externe' : 'Lien de paiement';
      fButtonValue.placeholder = 'https://...';
    } else {
      buttonValueField.style.display = 'none';
      fButtonValue.value = '';
    }
  });

  function renderImagePreview() {
    imagePreviewStrip.innerHTML = modalImages.map((src, i) => `
      <div class="thumb"><img src="${src}" alt=""><button type="button" class="remove-img" data-remove="${i}">✕</button></div>
    `).join('');
    imagePreviewStrip.querySelectorAll('[data-remove]').forEach(btn => {
      btn.addEventListener('click', () => { modalImages.splice(parseInt(btn.dataset.remove), 1); renderImagePreview(); });
    });
  }

  const cropperOverlay = document.getElementById('cropperOverlay');
  const cropperImage = document.getElementById('cropperImage');
  const cropperRatios = document.getElementById('cropperRatios');
  let cropperInstance = null;
  let currentRatioValue = NaN; // NaN = libre

  const RATIO_PRESETS = [
    { label: 'Libre', value: NaN },
    { label: 'Portrait 3:4', value: 3 / 4 },
    { label: 'Paysage 4:3', value: 4 / 3 },
    { label: 'Carré 1:1', value: 1 },
    { label: 'Large 16:9', value: 16 / 9 },
  ];

  // Le format suggéré en premier dépend de la page, mais "Libre" reste toujours disponible.
  function suggestedRatioFor(section) {
    if (section === 'boutique') return 1;
    if (section === 'featured') return 3 / 4;
    return 4 / 3;
  }

  function renderRatioButtons(suggested) {
    cropperRatios.innerHTML = RATIO_PRESETS.map(r => {
      const isSuggested = !isNaN(r.value) && Math.abs(r.value - suggested) < 0.001;
      const label = isSuggested ? `${r.label} ★` : r.label;
      return `<button type="button" class="cropper-ratio-btn ${isNaN(r.value) ? 'active' : ''}" data-ratio="${r.value}">${label}</button>`;
    }).join('');
    cropperRatios.querySelectorAll('[data-ratio]').forEach(btn => {
      btn.addEventListener('click', () => {
        const val = parseFloat(btn.dataset.ratio);
        currentRatioValue = isNaN(val) ? NaN : val;
        cropperRatios.querySelectorAll('.cropper-ratio-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        if (cropperInstance) cropperInstance.setAspectRatio(currentRatioValue);
      });
    });
  }

  function openCropper(dataUrl) {
    cropperImage.src = dataUrl;
    cropperOverlay.classList.add('show');
    const suggested = suggestedRatioFor(currentSection);
    currentRatioValue = NaN; // toujours libre au départ, le format suggéré n'est qu'une proposition
    renderRatioButtons(suggested);
    setTimeout(() => {
      if (cropperInstance) cropperInstance.destroy();
      cropperInstance = new Cropper(cropperImage, { aspectRatio: NaN, viewMode: 1, autoCropArea: 0.9, background: false });
    }, 50);
  }

  function closeCropper() {
    cropperOverlay.classList.remove('show');
    if (cropperInstance) { cropperInstance.destroy(); cropperInstance = null; }
  }

  document.getElementById('cropperCancel').addEventListener('click', closeCropper);

  document.getElementById('cropperConfirm').addEventListener('click', async () => {
    if (!cropperInstance) return;
    const cropBox = cropperInstance.getData();
    // La taille de sortie suit le recadrage réel choisi (libre ou format suggéré),
    // plafonnée pour rester légère, sans jamais déformer l'image.
    const MAX_DIM = 1600;
    let outW = Math.round(cropBox.width);
    let outH = Math.round(cropBox.height);
    if (outW > MAX_DIM || outH > MAX_DIM) {
      const scale = MAX_DIM / Math.max(outW, outH);
      outW = Math.round(outW * scale);
      outH = Math.round(outH * scale);
    }
    const canvas = cropperInstance.getCroppedCanvas({ width: outW, height: outH });
    canvas.toBlob(async (blob) => {
      closeCropper();
      uploadStatus.style.display = 'block';
      uploadStatus.textContent = "Envoi de l'image...";
      const fileName = `${currentSection}/${Date.now()}-${Math.random().toString(36).slice(2, 8)}.jpg`;
      const { data, error } = await sb.storage.from('images').upload(fileName, blob, { contentType: 'image/jpeg' });
      if (error) {
        uploadStatus.textContent = "Erreur d'envoi : " + error.message;
        return;
      }
      const { data: pub } = sb.storage.from('images').getPublicUrl(fileName);
      modalImages.push(pub.publicUrl);
      renderImagePreview();
      uploadStatus.style.display = 'none';
    }, 'image/jpeg', 0.9);
  });

  fImages.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => openCropper(ev.target.result);
    reader.readAsDataURL(file);
    fImages.value = '';
  });

  const featuredFieldWrap = document.getElementById('featuredFieldWrap');
  const fFullText = document.getElementById('fFullText');
  const fFeaturedLink = document.getElementById('fFeaturedLink');
  const fDescLabel = document.getElementById('fDescLabel');

  function openModal(item = null) {
    editingId = item ? item.id : null;
    modalImages = item && item.images ? [...item.images] : [];
    const isBoutique = currentSection === 'boutique';
    const isFeatured = currentSection === 'featured';
    buttonConfigFields.style.display = isBoutique ? 'block' : 'none';
    priceFieldWrap.style.display = isBoutique ? 'block' : 'none';
    featuredFieldWrap.style.display = isFeatured ? 'block' : 'none';
    fDescLabel.textContent = isFeatured ? 'Accroche courte (visible sur l\u2019image)' : 'Description courte';

    if (item) {
      modalTitle.textContent = "Modifier l'élément";
      fTitle.value = item.title || '';
      fDesc.value = item.description || '';
      fMeta.value = item.meta || '';
      fPrice.value = item.price || '';
      fButtonType.value = item.button_type || '';
      fButtonValue.value = item.button_value || '';
      fFullText.value = item.full_text || '';
      fFeaturedLink.value = isFeatured ? (item.button_value || '') : '';
      fButtonType.dispatchEvent(new Event('change'));
    } else {
      modalTitle.textContent = 'Nouvel élément';
      form.reset();
      buttonValueField.style.display = 'none';
    }
    renderImagePreview();
    overlay.classList.add('show');
    fTitle.focus();
  }

  function closeModal() { overlay.classList.remove('show'); editingId = null; }

  addBtn.addEventListener('click', () => openModal(null));
  document.getElementById('cancelBtn').addEventListener('click', closeModal);
  overlay.addEventListener('click', (e) => { if (e.target === overlay) closeModal(); });

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    saveBtn.disabled = true;
    saveBtn.textContent = 'Enregistrement...';

    const isFeatured = currentSection === 'featured';
    const payload = {
      page_slug: currentSection,
      title: fTitle.value,
      description: fDesc.value,
      meta: fMeta.value,
      price: currentSection === 'boutique' && fPrice.value ? parseFloat(fPrice.value) : null,
      currency: 'XOF',
      images: modalImages,
      full_text: isFeatured ? fFullText.value : null,
      button_type: currentSection === 'boutique' ? (fButtonType.value || null) : null,
      button_value: currentSection === 'boutique' ? (fButtonValue.value || null) : (isFeatured ? (fFeaturedLink.value || null) : null),
    };

    if (editingId) {
      await sb.from('content_items').update(payload).eq('id', editingId);
    } else {
      await sb.from('content_items').insert(payload);
    }

    saveBtn.disabled = false;
    saveBtn.textContent = 'Enregistrer';
    closeModal();
    await renderContentList(currentSection, sections.find(s => s.id === currentSection).color);
  });

  // ---------- AUTH GATE (Supabase Auth) ----------
  const authGate = document.getElementById('authGate');
  const appContent = document.getElementById('appContent');
  const loginForm = document.getElementById('loginForm');
  const loginUser = document.getElementById('loginUser');
  const loginPass = document.getElementById('loginPass');
  const loginError = document.getElementById('loginError');
  const loginBtn = document.querySelector('#authGate .btn-login');

  function unlockApp() {
    authGate.style.display = 'none';
    appContent.classList.add('unlocked');
    navigateTo('dashboard');
  }
  function lockApp() {
    authGate.style.display = 'flex';
    appContent.classList.remove('unlocked');
  }

  // Session déjà active sur cet appareil/navigateur ?
  (async () => {
    const { data: { session } } = await sb.auth.getSession();
    if (session) unlockApp();
  })();

  loginForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    loginError.classList.remove('show');
    loginBtn.disabled = true;
    loginBtn.textContent = 'Connexion...';

    const { data, error } = await sb.auth.signInWithPassword({
      email: loginUser.value,
      password: loginPass.value,
    });

    loginBtn.disabled = false;
    loginBtn.textContent = 'Se connecter';

    if (error) {
      loginError.textContent = 'Erreur : ' + error.message;
      loginError.classList.add('show');
      loginPass.value = '';
    } else {
      unlockApp();
    }
  });

  document.getElementById('logoutLink').addEventListener('click', async (e) => {
    e.preventDefault();
    await sb.auth.signOut();
    loginForm.reset();
    lockApp();
  });
</script>

</body>
</html>
